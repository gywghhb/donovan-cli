[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "donovan"
version = "0.1.12"
description = "donovan — AI Agent for your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tudor Iustin" }]
keywords = ["ai", "cli", "agent", "ollama", "openai", "tavily", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "httpx>=0.27",
  "pathspec>=0.12",
  "platformdirs>=4.2",
  "prompt-toolkit>=3.0.43",
  "psutil>=5.9",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rich>=13.7",
  "tenacity>=8.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]
browser = [
  "playwright>=1.40",
]
all = [
  "donovanagent[dev,browser]",
]

[project.scripts]
donovan = "donovanagent.cli:main"
donovanagent = "donovanagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/donovanagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
